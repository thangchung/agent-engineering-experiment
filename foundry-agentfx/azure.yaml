# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: foundry-agentfx
metadata:
    template: foundry-agentfx@0.1.0
services:
    claw-api:
        project: .
        host: azure.ai.agent
        language: docker
        docker:
            path: src/Claw.Api/Dockerfile
            context: .
            remoteBuild: true
        config:
            container:
                resources:
                    cpu: "1"
                    memory: 2Gi
    claw-channels:
        project: .
        host: containerapp
        language: docker
        docker:
            path: src/Claw.Channels/Dockerfile
            context: .
            remoteBuild: true
    coffeeshop-mcp:
        project: .
        host: containerapp
        language: docker
        docker:
            path: src/Coffeeshop.Mcp/Dockerfile
            context: .
            remoteBuild: true
    toolsearch-gateway:
        project: .
        host: containerapp
        language: docker
        docker:
            path: src/ToolSearch.Gateway/Dockerfile
            context: .
            remoteBuild: true
infra:
    provider: bicep
    path: infra
hooks:
    postprovision:
        name: postprovision
        kind: sh
        shell: sh
        run: infra/hooks/post-provision.sh
